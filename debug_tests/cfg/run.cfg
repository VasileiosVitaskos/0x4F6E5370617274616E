# ---------------------------------------------------------------------------
# Online SPARTAN - settings for one run
#
#   ./spartan_toy run.cfg
#
# One "key = value" per line. Everything after '#' is a comment. A key that is
# not listed here keeps its default; a key that is MISSPELLED is an error, so
# a typo can never silently do nothing.
# ---------------------------------------------------------------------------


# --- where the data comes from ---------------------------------------------

# Path to a text file, or the word "builtin" for the 20x8 demo series.
# Text format: one frame per line, `channels` numbers per line, separated by
# spaces or commas. Blank lines and lines starting with '#' are skipped.
input         = builtin

# How many channels one time step carries. 1 = univariate.
channels      = 1

# Window length, counted in FRAMES (time steps), not in numbers.
# The vector the maths sees has channels * window entries.
window        = 8

# How far the window moves each step, in frames.
#   stride = window  ->  windows do not overlap   (the default)
#   stride < window  ->  windows overlap
# Default: same as window.
stride        = 8


# --- the representation ----------------------------------------------------

# How many PCA directions we keep. This is also the number of letters in a
# word. Must not exceed channels * window.
components    = 3

# Total bit budget for one whole word. The allocator splits it across the
# positions in proportion to how much variance each direction carries.
# Default: 2 * components, i.e. 4 symbols per position, as in the reference.
total_bits    = 6

# How strongly the bit split is pulled back towards an even one. 0 lets the
# variance decide freely; larger values keep the split flat.
lambda        = 0.5


# --- online learning -------------------------------------------------------

# Step size of the online PCA. Larger follows change faster and jitters more.
learning_rate = 0.01

# Re-orthogonalise the directions every this many windows. This is a
# CORRECTNESS setting, not a speed one: the distance guarantee assumes the
# directions are perpendicular and of unit length.
gs_period     = 5

# How many windows to collect before the cut points are computed and frozen.
# Should be at least ten times the largest alphabet, or the cut points are
# noise. The program warns if it is not.
warmup        = 10


# --- output ----------------------------------------------------------------

# Where the symbols go. "-" means standard output.
# Format: CSV with a header, one row per window, symbols as integers.
words         = -

# Where the frozen dictionary goes: alphabet sizes, bits, eigenvalue shares
# and cut points. Leave empty to skip. An analysis script needs this file in
# order to recompute distances without re-running the C.
dictionary    =

# 1 prints letters instead of numbers. Easier to read, useless past 26
# symbols, and harder to parse. Keep 0 for experiments.
pretty        = 0
